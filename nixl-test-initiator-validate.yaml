apiVersion: v1
kind: Pod
metadata:
  name: nixl-test-initiator
  namespace: paragao
  labels: {app: nixl-test, role: initiator}
spec:
  restartPolicy: Never
  nodeSelector: {node.kubernetes.io/instance-type: p5en.48xlarge}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions: [{key: role, operator: In, values: ["target"]}]
        topologyKey: kubernetes.io/hostname
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  containers:
  - name: initiator
    image: 159553542841.dkr.ecr.ap-southeast-3.amazonaws.com/paragao/nixl-deepep-efa@sha256:c2673e4170119007d0825d0a20eeef75ddf717cf7797b731d4bc1bd76bacf693
    imagePullPolicy: Always
    env:
    - {name: NVIDIA_GDRCOPY, value: "enabled"}
    - {name: UCX_TLS, value: "rc,cuda_copy,cuda_ipc,tcp"}
    command: ["/bin/bash","-c"]
    args:
    - |
      echo "=== baked ENV check ==="
      echo "NIXL_PLUGIN_DIR=$NIXL_PLUGIN_DIR"
      echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
      echo "initiator -> TARGET_IP_PLACEHOLDER:9999"
      /opt/nixl-tests/nixl_test initiator TARGET_IP_PLACEHOLDER 9999
      echo "NIXL_INITIATOR_DONE rc=$?"
    securityContext: {capabilities: {add: ["SYS_ADMIN","IPC_LOCK"]}}
    volumeMounts: [{name: shmem, mountPath: /dev/shm}]
    resources:
      limits: {nvidia.com/gpu: 1, vpc.amazonaws.com/efa: 1}
      requests: {nvidia.com/gpu: 1, vpc.amazonaws.com/efa: 1}
  volumes:
  - name: shmem
    emptyDir: {medium: Memory, sizeLimit: 16Gi}
