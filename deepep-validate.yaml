apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: deepep-validate
  namespace: paragao
spec:
  runPolicy:
    cleanPodPolicy: Running
    backoffLimit: 3
  slotsPerWorker: 1
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: training.kubeflow.org/job-name
                    operator: In
                    values: ["deepep-validate"]
                topologyKey: kubernetes.io/hostname
          nodeSelector:
            node.kubernetes.io/instance-type: p5en.48xlarge
          restartPolicy: OnFailure
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - image: 159553542841.dkr.ecr.ap-southeast-3.amazonaws.com/paragao/nixl-deepep-efa@sha256:c2673e4170119007d0825d0a20eeef75ddf717cf7797b731d4bc1bd76bacf693
            imagePullPolicy: Always
            name: deepep-validate-launcher
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
            command:
            - /bin/bash
            - -c
            - |
              for host in $(awk '{print $1}' /etc/mpi/hostfile); do
                until ssh -o ConnectTimeout=3 -o BatchMode=yes -o StrictHostKeyChecking=no "$host" true 2>/dev/null; do
                  echo "waiting for sshd on $host"; sleep 3
                done
              done
              MASTER_ADDR=$(head -n1 /etc/mpi/hostfile | awk '{print $1}')
              /opt/amazon/openmpi/bin/mpirun \
                --allow-run-as-root --tag-output \
                -np 2 -N 1 --bind-to none \
                -x PATH -x LD_LIBRARY_PATH \
                -x NCCL_SOCKET_IFNAME \
                -x NCCL_DEBUG=INFO \
                -x NCCL_NET_PLUGIN=ofi -x NCCL_TUNER_PLUGIN=ofi \
                -x TORCHDYNAMO_DISABLE=1 \
                -x TORCH_COMPILE_DISABLE=1 \
                -x NCCL_GIN_TYPE=5 \
                -x NCCL_SYM_GIN_KERNELS_ENABLE=0 \
                -x MASTER_ADDR=$MASTER_ADDR -x MASTER_PORT=8361 \
                bash -c 'RANK=$OMPI_COMM_WORLD_RANK WORLD_SIZE=$OMPI_COMM_WORLD_SIZE \
                  python3 /opt/amazon/deepep/tests/elastic/test_ep.py --test-first-only --num-tokens=8192 --num-topk=8 --num-sms=12'
    Worker:
      replicas: 2
      template:
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: training.kubeflow.org/job-name
                    operator: In
                    values: ["deepep-validate"]
                  - key: training.kubeflow.org/job-role
                    operator: In
                    values: ["worker"]
                topologyKey: topology.kubernetes.io/zone
          nodeSelector:
            node.kubernetes.io/instance-type: p5en.48xlarge
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - image: 159553542841.dkr.ecr.ap-southeast-3.amazonaws.com/paragao/nixl-deepep-efa@sha256:c2673e4170119007d0825d0a20eeef75ddf717cf7797b731d4bc1bd76bacf693
            imagePullPolicy: Always
            name: deepep-validate-worker
            env:
            - name: NVIDIA_GDRCOPY
              value: "enabled"
            securityContext:
              capabilities:
                add: ["SYS_ADMIN", "IPC_LOCK"]
            volumeMounts:
            - name: shmem
              mountPath: /dev/shm
            resources:
              limits:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 16
              requests:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 16
          volumes:
          - name: shmem
            emptyDir:
              medium: Memory
              sizeLimit: 200Gi
