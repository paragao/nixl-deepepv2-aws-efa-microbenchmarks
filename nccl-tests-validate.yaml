apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-tests-validate
  namespace: paragao
spec:
  runPolicy:
    cleanPodPolicy: Running
    backoffLimit: 2
  slotsPerWorker: 8
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          nodeSelector:
            node.kubernetes.io/instance-type: p5en.48xlarge
          restartPolicy: OnFailure
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - image: 159553542841.dkr.ecr.ap-southeast-3.amazonaws.com/paragao/nixl-deepep-efa@sha256:c2673e4170119007d0825d0a20eeef75ddf717cf7797b731d4bc1bd76bacf693
            imagePullPolicy: Always
            name: launcher
            resources:
              requests: {cpu: "1", memory: 2Gi}
            command:
            - /bin/bash
            - -c
            - |
              for host in $(awk '{print $1}' /etc/mpi/hostfile); do
                until ssh -o ConnectTimeout=3 -o BatchMode=yes -o StrictHostKeyChecking=no "$host" true 2>/dev/null; do
                  echo "waiting for sshd on $host"; sleep 3
                done
              done
              RUN() {
                echo "=================== NCCL $1 ==================="
                /opt/amazon/openmpi/bin/mpirun --allow-run-as-root --tag-output \
                  -np 16 -N 8 --bind-to none \
                  -x PATH -x LD_LIBRARY_PATH \
                  -x NCCL_DEBUG=WARN \
                  -x NCCL_NET_PLUGIN=ofi -x NCCL_TUNER_PLUGIN=ofi \
                  -x NCCL_GIN_TYPE=5 -x NCCL_SYM_GIN_KERNELS_ENABLE=0 \
                  /opt/nccl-tests/build/$2 -b 1M -e 8G -f 2 -g 1
              }
              RUN all_reduce  all_reduce_perf
              RUN all_gather  all_gather_perf
              RUN alltoall    alltoall_perf
              echo "NCCL_TESTS_DONE"
    Worker:
      replicas: 2
      template:
        spec:
          nodeSelector:
            node.kubernetes.io/instance-type: p5en.48xlarge
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - image: 159553542841.dkr.ecr.ap-southeast-3.amazonaws.com/paragao/nixl-deepep-efa@sha256:c2673e4170119007d0825d0a20eeef75ddf717cf7797b731d4bc1bd76bacf693
            imagePullPolicy: Always
            name: worker
            env:
            - name: NVIDIA_GDRCOPY
              value: "enabled"
            securityContext:
              capabilities:
                add: ["SYS_ADMIN", "IPC_LOCK"]
            volumeMounts:
            - name: shmem
              mountPath: /dev/shm
            resources:
              limits:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 16
              requests:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 16
          volumes:
          - name: shmem
            emptyDir:
              medium: Memory
              sizeLimit: 200Gi
