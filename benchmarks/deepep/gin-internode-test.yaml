    command: ["sh","-c"]
    args:
    - |
      export WORLD_SIZE=2 RANK=1 MASTER_PORT=29500
      export MASTER_ADDR=deepep-gin-rank0.deepep-rank0.${K8S_NAMESPACE}.svc.cluster.local
      export NCCL_DEBUG=INFO
      export EP_DISABLE_GIN=0
      cd /opt/amazon/deepep
      python3 tests/elastic/test_ep.py --num-processes 8
    resources:
      limits:
        nvidia.com/gpu: 8
