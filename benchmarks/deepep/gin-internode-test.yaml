apiVersion: v1
kind: Service
metadata:
  name: deepep-rank0
  namespace: ${K8S_NAMESPACE}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: deepep-gin
    rank: "0"
  ports:
  - name: rdzv
    port: 29500
---
apiVersion: v1
kind: Pod
metadata:
  name: deepep-gin-rank0
  namespace: ${K8S_NAMESPACE}
  labels:
    app: deepep-gin
    rank: "0"
spec:
  restartPolicy: Never
  nodeName: ${NODE_0}
  hostname: deepep-gin-rank0
  subdomain: deepep-rank0
  containers:
  - name: p
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:nixl1.5.0-deepepv2-efa1.50.0
    command: ["sh","-c"]
    args:
    - |
      export WORLD_SIZE=2 RANK=0 MASTER_PORT=29500
      export MASTER_ADDR=deepep-gin-rank0.deepep-rank0.${K8S_NAMESPACE}.svc.cluster.local
      export NCCL_DEBUG=INFO
      export EP_DISABLE_GIN=0
      cd /opt/amazon/deepep
      python3 tests/elastic/test_ep.py --num-processes 8
    resources:
      limits:
        nvidia.com/gpu: 8
        vpc.amazonaws.com/efa: 16
    securityContext:
      capabilities:
        add: ["IPC_LOCK"]
---
apiVersion: v1
kind: Pod
metadata:
  name: deepep-gin-rank1
  namespace: ${K8S_NAMESPACE}
  labels:
    app: deepep-gin
    rank: "1"
spec:
